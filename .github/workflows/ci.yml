name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: build + vet + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      # -p 1: single package-test process at a time. This machine (and CI) is
      # shared; parallel test binaries have caused memory pressure before.
      - run: go test -p 1 ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
