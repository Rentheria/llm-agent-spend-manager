[package]
name = "llm-agent-spend-manager-desktop"
version = "0.0.1"
description = "Desktop wrapper around the llm-agent-spend-manager dashboard"
authors = ["Rentheria"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "llm_agent_spend_manager_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Enabled by tauri-cli in production builds.
custom-protocol = ["tauri/custom-protocol"]
